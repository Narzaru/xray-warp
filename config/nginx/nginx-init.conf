# Временный конфиг только для первичного получения сертификата.
# Используется до запуска основного стека.
# Монтируется в /etc/nginx/conf.d/default.conf временного nginx-контейнера.

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 200 'ready';
        add_header Content-Type text/plain;
    }
}
