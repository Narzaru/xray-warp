user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    server_tokens  off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml;

    # ── Certbot ACME + редирект 80 → 443 ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Фейковый сайт ────────────────────────────────────────────────────
    # Слушает plain HTTP — TLS уже снят XRay, который делает fallback сюда.
    # Порт 8080 не пробрасывается на хост, доступен только из Docker-сети.
    server {
        listen 8080;
        server_name _;

        root  /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(jpg|jpeg|png|gif|css|js|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── TLS-фронт: TLS терминирует nginx, а не XRay ───────────────────────
    # sslh направляет сюда весь TLS с 443. Посторонний запрос видит настоящий
    # сайт, а не 404 от XRay. Путь /game проксируется в XRay, который работает
    # по xhttp уже без TLS (в панели inbound должен быть security: none).
    server {
        listen 8443 ssl;
        http2 on;
        server_name ${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        root  /var/www/html;
        index index.html;

        # xhttp-эндпоинт XRay. Буферизация выключена — транспорт потоковый,
        # иначе nginx копит данные и ломает дуплекс.
        location /game {
            proxy_pass http://3x-ui:10000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            gzip off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(jpg|jpeg|png|gif|css|js|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
