# Подключается поверх docker-compose.yml при PROXY_MODE=warp.
# Добавляет Cloudflare WARP как SOCKS5-прокси на warp:1080.
#
# Использование:
#   docker-compose -f docker-compose.yml -f docker-compose.warp.yml up -d

services:
  warp:
    image: caomingjun/warp:latest
    container_name: warp
    restart: always
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - xray-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSm 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -qE 'warp=(on|plus)'"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 30s

  3x-ui:
    depends_on:
      warp:
        condition: service_healthy

