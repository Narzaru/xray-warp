# Подключается поверх docker-compose.yml при PROXY_MODE=warp.
# Добавляет Cloudflare WARP как SOCKS5-прокси на warp:1080.
#
# Использование:
#   docker-compose -f docker-compose.yml -f docker-compose.warp.yml up -d
#
# Образ: MicroWARP (https://github.com/ccbkkb/MicroWARP) — лёгкая замена
# официальному демону warp-svc (используется в caomingjun/warp), который
# страдает от утечки памяти (~3 МБ/час, см. диагностику). MicroWARP поднимает
# тот же WireGuard-туннель Cloudflare WARP средствами ядра, без демона.

services:
  warp:
    image: ghcr.io/ccbkkb/microwarp:latest
    container_name: warp
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/etc/wireguard
    networks:
      - xray-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSm 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -qE 'warp=(on|plus)'"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 30s

  3x-ui:
    depends_on:
      warp:
        condition: service_healthy

volumes:
  warp-data:

