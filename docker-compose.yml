services:

  # ── Мультиплексор порта 443 ──────────────────────────────────────────────
  # SSH  → host sshd
  # TLS  → caddy :8443 (Caddy терминирует TLS и проксирует /game в XRay)
  sslh:
    image: ghcr.io/yrutschle/sslh:latest
    container_name: sslh
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "443:443"
    # Конфиг — файлом, а не флагами: resolve_on_forward задаётся только в нём.
    configs:
      - source: sslh-cfg
        target: /etc/sslh/sslh.cfg
    command:
      - --foreground
      - --config=/etc/sslh/sslh.cfg
    # Congestion control живёт в сетевом namespace контейнера, а не на хосте:
    # без этого сокеты работают на cubic, который на канале с потерями режет
    # окно вдвое на каждую потерю. Внешнее TCP-соединение с клиентом
    # терминирует sslh, поэтому здесь это критично.
    sysctls:
      - net.ipv4.tcp_congestion_control=bbr
      - net.ipv4.tcp_rmem=4096 131072 8388608
      - net.ipv4.tcp_wmem=4096 16384 8388608
    networks:
      - xray-net
    depends_on:
      caddy:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── TLS-фронт и фейковый сайт ────────────────────────────────────────────
  # Порт 80  : ACME challenge (certbot) + редирект на 443
  # Порт 8080: plain HTTP — фейковый сайт без TLS (только внутри Docker-сети)
  # Порт 8443: TLS от sslh; /game проксируется в XRay по h2c
  #
  # Caddy вместо nginx — ради дуплексного проксирования: без него у XHTTP
  # работает только packet-up, который на мобильных сетях за CGNAT душит сам
  # себя потоком коротких соединений.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./html:/var/www/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - caddy-data:/data
      - caddy-config:/config
    sysctls:
      - net.ipv4.tcp_congestion_control=bbr
      - net.ipv4.tcp_rmem=4096 131072 8388608
      - net.ipv4.tcp_wmem=4096 16384 8388608
    networks:
      - xray-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Панель управления + встроенный XRay ──────────────────────────────────
  # Порт 2053 : веб-панель (только через SSH-туннель: ssh -L 2053:localhost:2053 -p 443 user@server)
  # Порт 10000: XRay inbound — xhttp без TLS, TLS снимает Caddy на :8443
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: always
    environment:
      - TZ=${TIMEZONE:-UTC}
    ports:
      - "127.0.0.1:2053:2053"
    volumes:
      - 3x-ui-data:/etc/x-ui
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./logs/3x-ui:/var/log/x-ui
    sysctls:
      - net.ipv4.tcp_congestion_control=bbr
      - net.ipv4.tcp_rmem=4096 131072 8388608
      - net.ipv4.tcp_wmem=4096 16384 8388608
    networks:
      - xray-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2053/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Автообновление сертификатов ──────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./logs/certbot:/var/log/letsencrypt
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew
          --webroot
          --webroot-path=/var/www/certbot
          --quiet;
        sleep 12h & wait $$!;
      done'
    networks:
      - xray-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"


networks:
  xray-net:
    driver: bridge

volumes:
  3x-ui-data:
  caddy-data:
  caddy-config:

configs:
  # Адреса бэкендов sslh по умолчанию резолвит один раз при старте. Когда
  # автообновление образов пересоздаёт caddy, тот может получить новый IP,
  # и sslh продолжает слать TLS по старому: SSH через 443 работает, VPN — нет.
  # resolve_on_forward заставляет резолвить имя на каждом соединении.
  sslh-cfg:
    content: |
      foreground: true;
      listen: ( { host: "0.0.0.0"; port: "443"; } );
      protocols: (
        { name: "ssh";     host: "host.docker.internal"; port: "${SSH_PORT:-22}"; resolve_on_forward: true; },
        { name: "tls";     host: "caddy"; port: "8443"; resolve_on_forward: true; },
        { name: "anyprot"; host: "caddy"; port: "8443"; resolve_on_forward: true; }
      );
